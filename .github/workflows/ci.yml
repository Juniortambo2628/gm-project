name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Quality ────────────────────────────────────────────
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite3, gd, fileinfo
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run Laravel Pint (auto-fix)
        working-directory: backend
        run: vendor/bin/pint

      - name: Run tests with coverage
        working-directory: backend
        run: vendor/bin/phpunit --coverage-text

      - name: Check for uncommitted Pint fixes
        working-directory: backend
        run: |
          if ! git diff --quiet; then
            echo "::warning::Pint auto-fixed code style issues. These will be committed by the auto-fix job."
          fi

  # ─── Frontend Quality ───────────────────────────────────────────
  frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build production assets
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 3

  # ─── Auto-Fix & Commit ──────────────────────────────────────────
  auto-fix:
    name: Commit Auto-Fixes
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      - name: Run Pint
        working-directory: backend
        run: vendor/bin/pint

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Auto-fix ESLint
        working-directory: frontend
        run: npx eslint src/ --fix || true

      - name: Commit fixes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "style: auto-fix code style [ci-skip]"
            git push
          fi

  # ─── Deployment Gate ────────────────────────────────────────────
  deploy-gate:
    name: Deploy Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify all jobs passed
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::Pipeline failed — deployment blocked"
            exit 1
          fi
          echo "All checks passed — deployment may proceed"
