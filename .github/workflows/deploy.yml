name: Deploy Backend to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Pre-Deploy Gate ────────────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite3, gd, fileinfo

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend
        run: php artisan test

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/app
            backend/bootstrap
            backend/config
            backend/database
            backend/resources
            backend/routes
            backend/public
            backend/artisan
            backend/composer.json
            backend/composer.lock
            backend/.env.example
          retention-days: 1

  # ─── Deploy to cPanel ───────────────────────────────────────────
  deploy:
    name: Deploy to cPanel
    needs: pre-deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://gm-coaching.com

    steps:
      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Create deployment archive
        run: tar czf deploy-package.tar.gz -C backend-dist .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-package.tar.gz
          target: /tmp/gm-deploy

      - name: Execute deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "═══════════════════════════════════════════"
            echo "  GM-Coaching Backend Deployment"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════════"

            CORE=/home/zhpebukm/gm-coaching-core
            SITE=/home/zhpebukm/gm-coaching.com
            API=$SITE/api
            BACKUP=/home/zhpebukm/backups/gm-$(date +%Y%m%d_%H%M%S)

            echo "▸ Creating backup..."
            mkdir -p "$BACKUP"
            for dir in app bootstrap config routes; do
              if [ -d "$CORE/$dir" ]; then cp -r "$CORE/$dir" "$BACKUP/"; fi
            done
            if [ -f "$CORE/composer.lock" ]; then cp "$CORE/composer.lock" "$BACKUP/"; fi
            echo "  Backup → $BACKUP"

            echo "▸ Extracting deployment package..."
            mkdir -p "$CORE" "$API"
            cd /tmp/gm-deploy
            tar xzf deploy-package.tar.gz 2>/dev/null || echo "  ⚠ tar had warnings (timestamps)"

            echo "▸ Syncing backend files..."
            cp -rf app "$CORE/"
            cp -rf bootstrap "$CORE/"
            cp -rf config "$CORE/"
            cp -rf database "$CORE/"
            cp -rf resources "$CORE/"
            cp -rf routes "$CORE/"
            cp -f artisan composer.json composer.lock "$CORE/"
            if [ -f .env.example ]; then cp -f .env.example "$CORE/"; fi

            echo "▸ Syncing public entry point..."
            rm -rf "$API/public"
            if [ -d "public" ]; then cp -rf public "$API/"; fi

            echo "▸ Ensuring directories..."
            mkdir -p \
              "$CORE/storage/app/public/cms" \
              "$CORE/storage/framework/cache/data" \
              "$CORE/storage/framework/sessions" \
              "$CORE/storage/framework/views" \
              "$CORE/storage/logs" \
              "$CORE/bootstrap/cache"

            echo "▸ Running composer install..."
            cd "$CORE"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            if [ $? -ne 0 ]; then echo "::error::Composer install failed"; exit 1; fi

            echo "▸ Running artisan commands..."
            cd "$CORE"

            php artisan key:generate --force 2>/dev/null || true
            php artisan migrate --force
            if [ $? -ne 0 ]; then echo "::error::Database migration failed"; exit 1; fi

            php artisan config:clear 2>/dev/null || true
            php artisan route:clear 2>/dev/null || true
            php artisan view:clear 2>/dev/null || true
            php artisan cache:clear 2>/dev/null || true
            php artisan event:clear 2>/dev/null || true

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize
            php artisan package:discover --ansi

            echo "▸ Setting up storage symlink..."
            ln -sfn "$CORE/storage/app/public" "$API/storage"

            echo "▸ Setting permissions..."
            chmod -R 775 "$CORE/storage" || true
            chmod -R 775 "$CORE/bootstrap/cache" || true
            chmod 755 "$CORE/artisan" || true

            echo "▸ Cleaning up..."
            rm -rf /tmp/gm-deploy
            ls -dt /home/zhpebukm/backups/gm-* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true

            echo "▸ Verifying API..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.gm-coaching.com/api/health" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  ✓ API healthy (HTTP $HTTP_STATUS)"
            else
              echo "  ⚠ API returned HTTP $HTTP_STATUS"
            fi

            echo ""
            echo "═══════════════════════════════════════════"
            echo "  ✓ Backend deployed successfully!"
            echo "═══════════════════════════════════════════"
            exit 0

  # ─── Post-Deploy Verify ─────────────────────────────────────────
  post-deploy:
    name: Post-Deploy Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for settle
        run: sleep 15

      - name: Verify API health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.gm-coaching.com/api/health" 2>/dev/null || echo "000")
          echo "API: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ API is healthy"
          else
            echo "::warning::API returned HTTP $HTTP_STATUS"
          fi

      - name: Verify frontend (Vercel)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://gm-coaching.com" 2>/dev/null || echo "000")
          echo "Frontend (Vercel): HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✓ Frontend is live on Vercel"
          else
            echo "::warning::Frontend returned HTTP $HTTP_STATUS"
          fi
