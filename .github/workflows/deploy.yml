name: Deploy Backend to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Pre-Deploy Gate ────────────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite3, gd, fileinfo

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend
        run: php artisan test

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/app
            backend/bootstrap
            backend/config
            backend/database
            backend/resources
            backend/routes
            backend/public
            backend/artisan
            backend/composer.json
            backend/composer.lock
            backend/.env.example
          retention-days: 1

  # ─── Deploy to cPanel ───────────────────────────────────────────
  deploy:
    name: Deploy to cPanel
    needs: pre-deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://gm-coaching.com

    steps:
      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Create deployment archive
        run: tar czf deploy-package.tar.gz -C backend-dist .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-package.tar.gz
          target: /tmp/gm-deploy

      - name: Execute deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "Hello from SSH - $(date)"
            whoami
            pwd
            ls /tmp/gm-deploy/ 2>&1 || echo "No deploy dir"
            exit 0

  # ─── Post-Deploy Verify ─────────────────────────────────────────
  post-deploy:
    name: Post-Deploy Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for settle
        run: sleep 15

      - name: Verify API health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.gm-coaching.com/api/health" 2>/dev/null || echo "000")
          echo "API: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ API is healthy"
          else
            echo "::warning::API returned HTTP $HTTP_STATUS"
          fi

      - name: Verify frontend (Vercel)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://gm-coaching.com" 2>/dev/null || echo "000")
          echo "Frontend (Vercel): HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✓ Frontend is live on Vercel"
          else
            echo "::warning::Frontend returned HTTP $HTTP_STATUS"
          fi
