name: Deploy Backend to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Pre-Deploy Gate ────────────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite3, gd, fileinfo

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend
        run: php artisan test

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/app
            backend/bootstrap
            backend/config
            backend/database
            backend/resources
            backend/routes
            backend/public
            backend/artisan
            backend/composer.json
            backend/composer.lock
            backend/.env.example
          retention-days: 1

  # ─── Deploy to cPanel ───────────────────────────────────────────
  deploy:
    name: Deploy to cPanel
    needs: pre-deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://gm-coaching.com

    steps:
      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-dist

      - name: Create deployment archive
        run: tar czf deploy-package.tar.gz -C backend-dist .

      - name: Prepare .env file
        shell: bash
        run: echo "$PROD_ENV_CONTENT" > deploy-env-file
        env:
          PROD_ENV_CONTENT: ${{ secrets.PROD_ENV_CONTENT }}

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-package.tar.gz,deploy-env-file
          target: /tmp/gm-deploy

      - name: Execute deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          timeout: 600s
          script: |
            echo "═══════════════════════════════════════════"
            echo "  GM-Coaching Backend Deployment"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════════"

            CORE=/home/zhpebukm/gm-coaching-core
            SITE=/home/zhpebukm/gm-coaching.com
            API=$SITE/api
            BACKUP=/home/zhpebukm/backups/gm-$(date +%Y%m%d_%H%M%S)

            echo "▸ Creating backup..."
            mkdir -p "$BACKUP"
            for dir in app bootstrap config routes; do
              if [ -d "$CORE/$dir" ]; then cp -r "$CORE/$dir" "$BACKUP/"; fi
            done
            if [ -f "$CORE/composer.lock" ]; then cp "$CORE/composer.lock" "$BACKUP/"; fi
            if [ -f "$CORE/.env" ]; then cp "$CORE/.env" "$BACKUP/"; fi
            echo "  Backup → $BACKUP"

            echo "▸ Extracting deployment package..."
            mkdir -p "$CORE" "$API"
            # Stage beside the live app (same filesystem, so the vendor/ swap below is a rename).
            STAGE=$(dirname "$CORE")/gm-deploy-stage
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            tar xzf /tmp/gm-deploy/deploy-package.tar.gz -C "$STAGE" 2>&1 | tail -3

            # Install dependencies before touching the live app. Deleting the live
            # vendor/ first left the API returning "Failed opening required
            # vendor/autoload.php" for the whole install, and indefinitely if it failed.
            echo "▸ Installing composer dependencies (staging)..."
            cd "$STAGE"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts 2>&1
            if [ ! -f "$STAGE/vendor/autoload.php" ]; then
              echo "::error::Composer install failed - production left on the previous release"
              echo "  PHP version: $(php -v 2>&1 | head -1)"
              rm -rf "$STAGE"
              exit 1
            fi

            # Validate the production .env before anything live changes: an invalid
            # file makes every request fail once the config cache is cleared.
            # Only the offending key is reported, never values.
            echo "▸ Validating production .env..."
            cat > "$STAGE/validate-env.php" <<'PHP'
            <?php
            require $argv[1];
            $content = file_get_contents($argv[2]);
            try {
                Dotenv\Dotenv::parse($content);
                exit(0);
            } catch (Throwable $e) {
                // Name the first bad key without echoing any value (it may be a secret).
                foreach (preg_split('/\R/', $content) as $n => $line) {
                    try { Dotenv\Dotenv::parse($line); } catch (Throwable $_) {
                        $key = trim(strtok($line, '='));
                        fwrite(STDERR, "  invalid .env line ".($n + 1).": {$key}=...\n");
                        exit(1);
                    }
                }
                fwrite(STDERR, "  .env could not be parsed\n");
                exit(1);
            }
            PHP
            if [ -f /tmp/gm-deploy/deploy-env-file ]; then
              if ! php "$STAGE/validate-env.php" "$STAGE/vendor/autoload.php" /tmp/gm-deploy/deploy-env-file; then
                echo "::error::PROD_ENV_CONTENT is not a valid .env file - production left unchanged. Quote values that contain spaces, e.g. APP_NAME=\"GM Coaching\"."
                rm -rf "$STAGE"
                exit 1
              fi
              echo "  ✓ .env parses"
            fi

            echo "▸ Syncing backend files..."
            cd "$STAGE"
            cp -rf app bootstrap config database resources routes "$CORE/"
            cp -f artisan composer.json composer.lock "$CORE/"

            echo "▸ Swapping in new vendor/..."
            rm -rf "$CORE/vendor.old"
            if [ -d "$CORE/vendor" ]; then mv "$CORE/vendor" "$CORE/vendor.old"; fi
            mv "$STAGE/vendor" "$CORE/vendor"
            rm -rf "$CORE/vendor.old"
            if [ ! -f "$CORE/vendor/autoload.php" ]; then
              echo "::error::vendor/ swap failed - vendor/autoload.php missing!"
              exit 1
            fi
            echo "  vendor/: EXISTS"

            echo "▸ Syncing public entry point..."
            rm -rf "$API/public" 2>/dev/null
            cp -rf "$STAGE/public/." "$API/"

            echo "▸ Ensuring directories..."
            mkdir -p \
              "$CORE/storage/app/public/cms" \
              "$CORE/storage/framework/cache/data" \
              "$CORE/storage/framework/sessions" \
              "$CORE/storage/framework/views" \
              "$CORE/storage/logs" \
              "$CORE/bootstrap/cache"

            echo "▸ Writing production .env..."
            cd "$CORE"
            if [ -f /tmp/gm-deploy/deploy-env-file ]; then
              cp /tmp/gm-deploy/deploy-env-file "$CORE/.env"
              echo "  ✓ .env restored from deployment secret"
            elif [ ! -f .env ]; then
              echo "  ⚠ No .env found - copying from .env.example"
              cp .env.example .env
            fi
            if ! grep -q "APP_KEY=base64:" "$CORE/.env" 2>/dev/null; then
              echo "::warning::APP_KEY not found in .env"
            fi

            echo "▸ Running artisan commands..."
            cd "$CORE"
            php artisan config:clear 2>&1 || true
            php artisan route:clear 2>&1 || true
            php artisan view:clear 2>&1 || true
            php artisan cache:clear 2>&1 || true
            php artisan event:clear 2>&1 || true

            php artisan config:cache 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::config:cache failed - check .env and APP_KEY"
              exit 1
            fi
            php artisan route:cache 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::route:cache failed"
              exit 1
            fi
            php artisan view:cache 2>&1 || echo "  ⚠ view:cache had warnings"
            php artisan event:cache 2>&1 || echo "  ⚠ event:cache had warnings"
            php artisan optimize 2>&1 || true
            php artisan package:discover --ansi 2>&1 || true

            echo "▸ Running database migrations..."
            cd "$CORE"
            php artisan migrate --force 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::Database migrations failed - backup of the previous release is at $BACKUP"
              exit 1
            fi

            echo "▸ Ensuring Laravel scheduler cron..."
            # Reminders, Stripe reconciliation and releasing unpaid Calendly slots all
            # run from the scheduler, which needs this one-minute cron entry.
            PHP_BIN=$(command -v php || echo /usr/local/bin/php)
            CRON_LINE="* * * * * cd $CORE && $PHP_BIN artisan schedule:run >> /dev/null 2>&1"
            if crontab -l 2>/dev/null | grep -F "$CORE" | grep -q "artisan schedule:run"; then
              echo "  ✓ Scheduler cron already installed"
            else
              CRON_TMP=$(mktemp)
              crontab -l 2>/dev/null > "$CRON_TMP" || true
              echo "$CRON_LINE" >> "$CRON_TMP"
              crontab "$CRON_TMP"
              rm -f "$CRON_TMP"
              if crontab -l 2>/dev/null | grep -F "$CORE" | grep -q "artisan schedule:run"; then
                echo "  ✓ Scheduler cron installed: $CRON_LINE"
              else
                echo "::warning::Could not install the scheduler cron. Add it in cPanel > Cron Jobs: $CRON_LINE"
              fi
            fi
            php artisan schedule:list 2>&1 || true

            if ! grep -q "^CALENDLY_API_TOKEN=..*" "$CORE/.env" 2>/dev/null; then
              echo "::warning::CALENDLY_API_TOKEN is not set in PROD_ENV_CONTENT - unpaid booking slots will not be released"
            fi

            echo "▸ Setting up storage symlink..."
            ln -sfn "$CORE/storage/app/public" "$API/storage"

            echo "▸ Setting permissions..."
            chmod -R 775 "$CORE/storage" 2>/dev/null || true
            chmod -R 775 "$CORE/bootstrap/cache" 2>/dev/null || true
            chmod 755 "$CORE/artisan" 2>/dev/null || true

            echo "▸ Cleaning up..."
            rm -rf /tmp/gm-deploy "$STAGE"
            ls -dt /home/zhpebukm/backups/gm-* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true

            echo "▸ Verifying API..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.gm-coaching.com/api/health" 2>/dev/null || echo "000")
            echo "  HTTP $HTTP_STATUS"

            echo ""
            echo "═══════════════════════════════════════════"
            echo "  ✓ Backend deployed successfully!"
            echo "═══════════════════════════════════════════"
            exit 0

  # ─── Post-Deploy Verify ─────────────────────────────────────────
  post-deploy:
    name: Post-Deploy Verification
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Wait for settle
        run: sleep 15

      # Redirects (apex → www, http → https), key pages, API health, the
      # paid-only service list and the booking endpoints. Fails the run on error.
      - name: Smoke tests
        run: bash .github/scripts/smoke-test.sh
