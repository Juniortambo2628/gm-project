name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      - name: Prepare Backend Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Tests
        working-directory: backend
        run: php artisan test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Type Check Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: test-gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            echo "Starting deployment..."
            
            # 1. Update the git repository on the server
            cd /home/zhpebukm/repositories/gm-project
            git pull origin main
            
            # 2. Set Paths
            export CORE=/home/zhpebukm/gm-coaching-core
            export SITE=/home/zhpebukm/gm-coaching.com
            export API=$SITE/api
            
            # 3. Synchronize backend core files
            /bin/mkdir -p $CORE $API
            /bin/tar cf - -C backend app bootstrap config database resources routes | /bin/tar xf - -C $CORE
            /bin/cp -f backend/artisan backend/composer.json backend/composer.lock $CORE/
            
            # 4. Synchronize public API entry point
            /bin/tar cf - -C backend public | /bin/tar xf - -C $API
            /bin/cp -f backend/public/.htaccess $API/ 2>/dev/null || true
            
            # 5. Build/Restore symlinks and create directories
            /bin/mkdir -p $CORE/storage/app/public/cms $CORE/storage/framework/cache/data $CORE/storage/framework/sessions $CORE/storage/framework/views $CORE/storage/logs $CORE/bootstrap/cache
            /bin/chmod -R 775 $CORE/storage 2>/dev/null || true
            /bin/chmod -R 775 $CORE/bootstrap/cache 2>/dev/null || true
            /bin/chmod 755 $CORE/artisan 2>/dev/null || true
            /bin/ln -sfn $CORE/storage/app/public $API/storage
            
            # 6. Run Composer Install on the backend
            cd $CORE
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            
            # 7. Run Migrations
            php artisan migrate --force
            
            # 8. Clear all caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan event:clear
            
            # 9. Rebuild production caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # 10. Fix permissions
            /bin/chmod -R 775 $CORE/storage 2>/dev/null || true
            /bin/chmod -R 775 $CORE/bootstrap/cache 2>/dev/null || true
            
            echo "Deployment finished successfully!"
